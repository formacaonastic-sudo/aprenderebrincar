<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogo do Galo</title>
<style>body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#eef5ff,#fff);color:#172033;text-align:center}main{max-width:650px;margin:auto;padding:35px 18px}.back{display:inline-block;color:#2563eb;text-decoration:none;font-weight:700;margin-bottom:20px}.board{display:grid;grid-template-columns:repeat(3,100px);gap:9px;justify-content:center;margin:25px}.cell{width:100px;height:100px;border:0;border-radius:18px;background:white;box-shadow:0 5px 15px #0002;font-size:55px;cursor:pointer}.new{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer}@media(max-width:450px){.board{grid-template-columns:repeat(3,82px)}.cell{width:82px;height:82px}}</style></head>
<body><main><a class="back" href="../index.html">← Voltar ao portal</a><h1>❌⭕ Jogo do Galo</h1><p id="status">Vez do ❌</p><div class="board" id="board"></div><button class="new" onclick="novo()">Novo jogo</button></main>
<script>
let a,p,f;
function novo(){a=Array(9).fill('');p='❌';f=false;document.getElementById('status').textContent='Vez do ❌';let b=document.getElementById('board');b.innerHTML='';a.forEach((_,i)=>{let c=document.createElement('button');c.className='cell';c.onclick=()=>jogar(i,c);b.appendChild(c)})}
function jogar(i,c){if(f||a[i])return;a[i]=p;c.textContent=p;let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(w.some(x=>x.every(n=>a[n]===p))){document.getElementById('status').textContent='🎉 '+p+' ganhou!';f=true;return}if(a.every(Boolean)){document.getElementById('status').textContent='🤝 Empate!';f=true;return}p=p==='❌'?'⭕':'❌';document.getElementById('status').textContent='Vez do '+p}novo();
</script></body></html>
