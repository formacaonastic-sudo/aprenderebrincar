<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebentar as Bolas</title>
<style>body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#fff4d9,#fff);color:#172033;text-align:center}main{max-width:850px;margin:auto;padding:30px 15px}.back{color:#d97706;text-decoration:none;font-weight:700}.area{height:470px;background:#e5f7ff;border-radius:25px;position:relative;overflow:hidden;box-shadow:inset 0 0 25px #0001}.ball{position:absolute;width:65px;height:78px;border-radius:50%;cursor:pointer;box-shadow:inset -9px -10px 13px #0002;animation:flut 2s ease-in-out infinite}.ball:after{content:'';position:absolute;bottom:-9px;left:27px;border:7px solid transparent;border-top-color:currentColor}@keyframes flut{50%{transform:translateY(-12px)}}button{border:0;border-radius:12px;background:#f59e0b;color:white;padding:12px 20px;font-weight:700;font-size:16px;cursor:pointer}</style></head>
<body><main><a class="back" href="../index.html">← Voltar ao portal</a><h1>🎈 Rebentar as Bolas</h1><p id="status">Bolas: 15</p><div class="area" id="area"></div><br><button onclick="novo()">Novas bolas</button></main>
<script>
function novo(){let a=document.getElementById('area');a.innerHTML='';let cores=['#ef5350','#42a5f5','#66bb6a','#ffca28','#ab47bc','#ff7043'];for(let i=0;i<15;i++){let b=document.createElement('div');b.className='ball';b.style.background=cores[i%cores.length];b.style.color=cores[i%cores.length];b.style.left=(Math.random()*88+3)+'%';b.style.top=(Math.random()*78+4)+'%';b.onclick=()=>{b.remove();contar()};a.appendChild(b)}document.getElementById('status').textContent='Bolas: 15'}
function contar(){let n=document.querySelectorAll('.ball').length;document.getElementById('status').textContent=n?'Bolas: '+n:'🎉 Parabéns! Rebentaste todas!'}novo();
</script></body></html>
